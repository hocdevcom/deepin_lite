name: Deepin Lite ISO
on:
  workflow_dispatch:
    inputs:
      projects:
        description: 'Optional JSON source subset for diagnostics; blank builds full ISO'
        required: false
        type: string
      package_run_id:
        description: 'Optional: comma-separated run IDs providing all successful package jobs'
        required: false
        type: string
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: deepin-lite-${{ github.ref }}-${{ inputs.projects || 'full' }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate configuration and scripts
        run: |
          python3 scripts/policy.py validate
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts
          for script in scripts/*.sh; do bash -n "$script"; done
          sudo apt-get update
          sudo apt-get install -y shellcheck xvfb xauth x11-xserver-utils dbus
          shellcheck scripts/*.sh
      - name: Check virtual display primary output
        run: |
          dbus-run-session -- xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp -noreset" \
            bash scripts/build-session.sh /bin/true
      - name: Verify source removal against locked upstream revisions
        run: |
          python3 scripts/prepare-sources.py "$RUNNER_TEMP/deepin-lite-sources"
          find "$RUNNER_TEMP/deepin-lite-sources/dde-daemon" -name '*.go' -print0 | xargs -0 gofmt -l
  packages:
    if: github.event_name != 'pull_request' && inputs.package_run_id == ''
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.projects || '["deepin-desktop-base", "dde-api", "dde-daemon", "dde-session", "dde-file-manager", "dde-control-center", "dde-session-shell", "dde-session-ui", "dde-appearance", "dde-qt-dbus-factory", "dtkwidget", "dtk6widget", "dde-api-proxy", "dde-tray-loader"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install source builder tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap gnupg curl ca-certificates \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools python3
      - name: Build and test source package
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -o pipefail
          sudo bash scripts/build.sh source "$PROJECT" 2>&1 | tee build.log
      - name: Upload audited source packages
        uses: actions/upload-artifact@v7
        with:
          name: deepin-package-${{ matrix.project }}
          path: |
            dist/source-debs/
            dist/sources/
          retention-days: 7
          if-no-files-found: error
      - name: Upload package logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepin-source-report-${{ matrix.project }}-${{ github.run_number }}
          path: |
            build.log
            dist/*.log
            dist/*.txt
            dist/upstream.InRelease
          retention-days: 14
  build:
    if: always() && !cancelled() && github.event_name != 'pull_request' && inputs.projects == '' && needs.validate.result == 'success' && (needs.packages.result == 'success' || inputs.package_run_id != '')
    needs: [validate, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap gnupg curl ca-certificates \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools \
            python3 qemu-system-x86 ovmf
          df -h .
      - name: Verify reused package provenance
        if: inputs.package_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: python3 scripts/verify-reuse.py
      - name: Collect audited package artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: python3 scripts/download-packages.py
      - name: Verify reused source contents
        if: inputs.package_run_id != ''
        run: |
          set -o pipefail
          python3 scripts/verify-source-artifacts.py | tee source-reuse-audit.txt
      - name: Assemble audited packages into live ISO
        run: |
          set -o pipefail
          sudo bash scripts/build.sh image 2>&1 | tee build.log
      - name: Boot and verify live desktop
        run: sudo bash scripts/smoke.sh
      - name: Show source test failures
        if: failure()
        run: |
          shopt -s nullglob
          for log in dist/source-build-*.log; do
            echo "Failure excerpts from $log"
            grep -n -m 20 -B 8 -A 15 \
              -e '^[[:space:]]*--- FAIL:' -e '^FAIL[[:space:]]' \
              -e 'panic:' -e 'fatal error:' -e 'error:' "$log" || true
          done
      - name: Build summary
        if: always()
        run: |
          if [ -f dist/deepin-lite-amd64.iso ]; then
            echo '### Deepin Lite amd64' >> "$GITHUB_STEP_SUMMARY"
            du -h dist/deepin-lite-amd64.iso >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f dist/policy-audit.txt ]; then cat dist/policy-audit.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload verified ISO
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: deepin-lite-amd64-${{ github.run_number }}
          path: |
            dist/deepin-lite-amd64.iso
            dist/SHA256SUMS
            dist/source-debs/
            dist/sources/
            dist/runtime-debs/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepin-lite-reports-${{ github.run_number }}
          path: |
            build.log
            package-provenance.json
            source-reuse-audit.txt
            dist/*.txt
            dist/*.tsv
            dist/*.json
            dist/*.log
            dist/desktop-*.png
            dist/upstream.InRelease
          retention-days: 14
