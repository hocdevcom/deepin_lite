name: Deepin Lite ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deepin-lite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate configuration and scripts
        run: |
          python3 scripts/policy.py validate
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts
          for script in scripts/*.sh; do bash -n "$script"; done
          sudo apt-get update
          sudo apt-get install -y shellcheck xvfb xauth x11-xserver-utils dbus
          shellcheck scripts/*.sh
      - name: Check virtual display primary output
        run: |
          dbus-run-session -- xvfb-run --auto-servernum \
            --server-args="-screen 0 1280x720x24 -nolisten tcp -noreset" \
            bash scripts/build-session.sh /bin/true
      - name: Verify source removal against locked upstream revisions
        run: |
          python3 scripts/prepare-sources.py "$RUNNER_TEMP/deepin-lite-sources"
          find "$RUNNER_TEMP/deepin-lite-sources/dde-daemon" -name '*.go' -print0 | xargs -0 gofmt -l
  build:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debootstrap gnupg curl ca-certificates \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin grub-common mtools \
            python3 qemu-system-x86
          df -h .
      - name: Build source packages and live ISO
        run: |
          set -o pipefail
          sudo bash scripts/build.sh 2>&1 | tee build.log
      - name: Boot and verify live desktop
        run: sudo bash scripts/smoke.sh
      - name: Show source test failures
        if: failure()
        run: |
          shopt -s nullglob
          for log in dist/source-build-*.log; do
            echo "Failure excerpts from $log"
            grep -n -m 20 -B 8 -A 15 \
              -e '^[[:space:]]*--- FAIL:' -e '^FAIL[[:space:]]' \
              -e 'panic:' -e 'fatal error:' -e 'error:' "$log" || true
          done
      - name: Build summary
        if: always()
        run: |
          if [ -f dist/deepin-lite-amd64.iso ]; then
            echo '### Deepin Lite amd64' >> "$GITHUB_STEP_SUMMARY"
            du -h dist/deepin-lite-amd64.iso >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f dist/policy-audit.txt ]; then cat dist/policy-audit.txt >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload verified ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: deepin-lite-amd64-${{ github.run_number }}
          path: |
            dist/deepin-lite-amd64.iso
            dist/SHA256SUMS
            dist/source-debs/
            dist/sources/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Upload reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepin-lite-reports-${{ github.run_number }}
          path: |
            build.log
            dist/*.txt
            dist/*.tsv
            dist/*.json
            dist/*.log
            dist/upstream.InRelease
          retention-days: 14
