set default=0
set timeout=5
menuentry "Deepin Lite (Live, Tieng Viet)" {
    linux /live/vmlinuz boot=live components username=live locales=vi_VN.UTF-8 timezone=Asia/Ho_Chi_Minh hostname=deepin-lite noeject
    initrd /live/initrd.img
}
menuentry "Deepin Lite (Live, English)" {
    linux /live/vmlinuz boot=live components username=live locales=en_US.UTF-8 timezone=Asia/Ho_Chi_Minh hostname=deepin-lite noeject
    initrd /live/initrd.img
}
menuentry "Deepin Lite (Install)" {
    linux /live/vmlinuz boot=live components username=live locales=vi_VN.UTF-8 timezone=Asia/Ho_Chi_Minh hostname=deepin-lite livecd-installer noeject
    initrd /live/initrd.img
}
menuentry "Deepin Lite (safe graphics)" {
    linux /live/vmlinuz boot=live components username=live locales=vi_VN.UTF-8 nomodeset noeject
    initrd /live/initrd.img
}
